<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whac-A-Mole</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="timer">
        <span class="timer_label">Time Left:</span>
        <span class="timer_value">60</span>
    </div>

    <header class="header">
        <h1 class="header_title">Welcome to Whack-A-Mole</h1>
        <div class="score">
            <span class="score_label">Let's Go, your current score is:</span>
            <span class="score_value">0</span>
        </div>
        <button class="start-game-btn">Start Game !</button>
    </header>

    <main class="game-board">
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
        <div class="game-board_block"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
